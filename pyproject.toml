[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jhu-xview3"
version = "1.0.0"
description = "Controlled label-efficiency study for dark-vessel detection in Sentinel-1 SAR"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "John Roth"},
    {name = "Kyle Wagner"},
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15",
    "rasterio>=1.3.9",
    "shapely>=2.0",
    "huggingface_hub>=0.23",
    "pyyaml>=6.0",
    "torch>=2.7",
    "torchvision>=0.22",
    "timm>=1.0",
    "lightning>=2.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
checkpoints = ["transformers>=4.44", "configilm>=0.6"]
dev = ["pytest>=8.0", "pypdf>=6.0"]
references = ["ultralytics>=8.3"]

[project.scripts]
xview3-train = "src.runtime.train:main"
xview3-results = "src.analysis.h100_results:main"
xview3-final-eval = "src.eval.final_eval:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
