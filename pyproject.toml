# Project config (DEVPLAN P0.1). `pip install -e .` is the only sanctioned
# install; imports resolve as absolute `from src.…` from the repo root.
#
# NOTE — torch install order (see README + locks/): install torch/torchvision
# from the machine-specific index URL FIRST (cu12x wheel matched to the GPU),
# then `pip install -e .`. The bare `torch` requirement below is satisfied by
# the pre-installed wheel; a fresh `pip install -e .` without that step pulls
# the default PyPI wheel, which is wrong on both GPU boxes (DEVPLAN Appendix C).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jhu-xview3"
version = "0.1.0"
description = "Label-efficient dark-vessel detection in Sentinel-1 SAR (xView3): a controlled two-track (ViT/CNN) comparison of downloaded pretrained backbones"
requires-python = ">=3.11"
dependencies = [
    # numerics / eval
    "numpy>=1.26",
    "scipy>=1.11",
    # data pipeline (Phase 1)
    "pandas>=2.1",
    "pyarrow>=15",
    "rasterio>=1.3.9",
    "shapely>=2.0",
    "huggingface_hub>=0.23",
    # models / training (Phases 3+)
    "torch>=2.7",          # install from the machine index URL first — see note above
    "torchvision>=0.22",
    "timm>=1.0",
    "lightning>=2.4",
    "transformers>=4.44",  # SatDINO AutoModel / trust_remote_code (P3.2)
    "configilm>=0.6",      # reBEN BigEarthNet ConvNeXt loader (P3.2)
    # analysis
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
references = ["ultralytics>=8.3"]  # YOLO26 reference arm R2 (P4.5)

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
