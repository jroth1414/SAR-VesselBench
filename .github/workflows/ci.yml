name: CI

on:
  push:
    branches: [dev, final-submission]
  pull_request:
    branches: [dev, final-submission]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Frozen scientific guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: locks/env-cpu-test-paper.txt
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r locks/env-cpu-test-paper.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run frozen guards
        run: make guards

  tests:
    name: Full CPU suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: locks/env-cpu-test-paper.txt
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r locks/env-cpu-test-paper.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: python -m pytest -q
