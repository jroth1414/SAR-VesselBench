name: CI

# Enforcement layer for the anti-drift guard tests (see DEVPLAN §1b).
# Runs on every push and PR to the active branches. A PR cannot merge if these
# fail (once a guard's target file exists). Intentionally CPU-only and
# lightweight: it checks correctness invariants, not model training — no GPU,
# no large data, no model downloads; the guard tests run on tiny fixtures.
#
# Expected color on a fresh clone (see the DEVPLAN cold-start runbook):
#   - The three not-yet-written guards are SKIPPED (each runs only if its file
#     exists), so the guard job is green-with-skips early in the project.
#   - test_scorer_immutable is GREEN after sprint-2b's intentional scorer
#     re-freeze; any future red is a STOP.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same branch to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-tests:
    name: Guard tests (anti-drift invariants)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-ci.txt') }}

      - name: Install CI dependencies
        # CPU-only, minimal: enough to import the package and run the guard
        # tests against tiny fixtures. NOT the full training environment (no
        # CUDA-pinned torch — see locks/ for the GPU machines). Install a small
        # CPU torch wheel EXPLICITLY, before requirements-ci.txt, so timm does
        # not pull the large default (CUDA) wheel transitively.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      - name: Run the anti-drift guard tests (DEVPLAN §1b)
        # Each guard kills one silent-corruption mode: leakage, architecture
        # drift, wrong/partial checkpoint load, scorer drift. A guard runs only
        # if its file exists yet, so a fresh clone is green-with-skips for the
        # not-yet-written guards (see the cold-start runbook).
        run: |
          ran=0
          for f in tests/test_split_disjoint.py \
                   tests/test_splits_immutable.py \
                   tests/test_backbone_parity.py \
                   tests/test_fm_checkpoints_load.py \
                   tests/test_scorer_immutable.py; do
            if [ -f "$f" ]; then
              echo "== running $f =="
              pytest -v "$f"
              ran=1
            else
              echo "::notice::$f not present yet — skipped (expected early in the project)"
            fi
          done
          if [ "$ran" = "0" ]; then
            echo "::warning::no guard test files present yet"
          fi

  full-suite:
    name: Full test suite
    runs-on: ubuntu-latest
    # Run the rest of the tests too, but the guard job above is the one that
    # encodes the study-validity invariants.
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-ci.txt') }}

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      - name: Run full test suite
        # Do not fail the whole CI on missing non-guard tests early in the
        # project; the guard job above is the hard gate for frozen artifacts.
        run: |
          pytest -v tests/ || {
            echo "::error::Test suite failed. If this is the guard tests, do NOT merge.";
            exit 1;
          }
